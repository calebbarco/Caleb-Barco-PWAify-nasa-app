<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NASA Space Explorer</title>
  <meta name="theme-color" content="#061f4a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <p id="connectionStatus" class="connection-status" role="status" aria-live="polite" hidden>
      You are offline. Previously cached NASA responses may be available.
    </p>
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <section id="installPrompt" class="install-prompt" aria-labelledby="installTitle" aria-live="polite" hidden>
      <div>
        <h2 id="installTitle">Install Space Explorer</h2>
        <p id="installInstructions">Keep NASA's space images close at hand.</p>
      </div>
      <button id="installButton" type="button">Install app</button>
    </section>

    <section class="notification-settings" aria-labelledby="notificationTitle">
      <div>
        <h2 id="notificationTitle">Space alerts</h2>
        <p id="notificationStatus" role="status" aria-live="polite"></p>
      </div>
      <button id="requestNotificationButton" type="button">Enable notifications</button>
    </section>

    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button id="loadButton" type="button">Get Space Images</button>
    </div>

    <section class="space-fact" aria-labelledby="spaceFactTitle">
      <h2 id="spaceFactTitle">Did You Know?</h2>
      <p id="spaceFact"></p>
    </section>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <dialog id="apodModal" class="apod-modal" aria-labelledby="modalTitle">
    <button class="modal-close" type="button" aria-label="Close image details">&times;</button>
    <img class="modal-image" alt="" />
    <div class="modal-content">
      <h2 id="modalTitle"></h2>
      <p class="modal-date"></p>
      <p class="modal-explanation"></p>
    </div>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
